<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSE JUPAS 選科助手</title>
<meta name="theme-color" content="#1aa260">
<style>
:root{--g:#1aa260;--g2:#13824c;--gl:#e7f6ee;--bg:#f4f6f5;--card:#fff;--tx:#1d2521;--mu:#6b7670;--bd:#e3e8e5;
--c1:#1aa260;--c2:#f0a020;--c3:#e8590c;--c4:#9aa3a0;--c5:#c92a2a;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
a{color:var(--g2)}
header{background:linear-gradient(135deg,#1aa260,#0f8a50);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.08)}
header h1{margin:0;font-size:19px;letter-spacing:.5px}
header .sub{font-size:12px;opacity:.9;margin-top:2px}
main{max-width:860px;margin:0 auto;padding:12px 12px 96px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);border:1px solid var(--bd)}
.seg{display:flex;background:var(--gl);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-size:14px;color:var(--g2);font-weight:600;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:4px}
select,input[type=text],input[type=number],input[type=search]{font-size:15px;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);width:100%;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#889 50%),linear-gradient(135deg,#889 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.erow{display:grid;grid-template-columns:1fr 92px 34px;gap:8px;margin-top:8px;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--g);color:#fff}
.btn.ghost{background:var(--gl);color:var(--g2)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.x{border:0;background:#f1f3f2;border-radius:9px;height:36px;font-size:18px;color:#888;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mu);font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--tx)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.sum div{background:#fff;border:1px solid var(--bd);border-radius:12px;text-align:center;padding:7px 2px;cursor:pointer}
.sum b{display:block;font-size:18px}
.sum span{font-size:11.5px;color:var(--mu)}
.sum div.on{outline:2px solid var(--g)}
.prog{position:relative}
.prog .top{display:flex;gap:8px;align-items:flex-start}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;color:#fff;white-space:nowrap}
.b1{background:var(--c1)}.b2{background:var(--c2)}.b3{background:var(--c3)}.b4{background:var(--c4)}.b5{background:var(--c5)}
.inst{font-size:11.5px;font-weight:700;color:var(--g2);background:var(--gl);padding:2px 7px;border-radius:7px}
.inst.fund{color:#5f3dc4;background:#f3f0ff}
.code{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.pname{font-size:16px;font-weight:700;margin:4px 0 1px;line-height:1.35}
.pen{font-size:12px;color:var(--mu);line-height:1.3}
.fav{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;line-height:1;color:#c7cdca;padding:0 2px}
.fav.on{color:#e64980}
.scorebar{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.kv{background:#f6f8f7;border-radius:10px;padding:5px 9px;font-size:12px;color:var(--mu)}
.kv b{color:var(--tx);font-size:14px;margin-left:3px}
.tag{font-size:11px;border-radius:6px;padding:2px 6px;background:#fff4e6;color:#b35c00;margin-left:4px}
.tag.gr{background:#eef1f0;color:#5f6b66}
details{margin-top:8px}
details summary{cursor:pointer;color:var(--g2);font-size:13px;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
.det{font-size:13px;line-height:1.55;margin-top:6px}
.det h4{margin:10px 0 4px;font-size:13px}
.det pre{white-space:pre-wrap;font-family:inherit;margin:0;background:#f8faf9;border-radius:8px;padding:8px;color:#444;font-size:12px;max-height:220px;overflow:auto}
.fail{color:var(--c5);font-size:12.5px;margin-top:6px}
.disc{font-size:12px;color:#7a5b00;background:#fff9db;border:1px solid #ffe8a1;border-radius:12px;padding:10px;line-height:1.5}
nav.tabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:28px;box-shadow:0 4px 18px rgba(0,0,0,.15);display:flex;padding:6px;z-index:30}
nav.tabs button{flex:1;border:0;background:none;padding:7px 2px;border-radius:22px;font-size:12px;color:#555;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:19px;line-height:1}
nav.tabs button.on{background:var(--gl);color:var(--g2);font-weight:700}
.page{display:none}.page.on{display:block}
.md h1{font-size:19px}.md h2{font-size:17px;margin-top:22px;border-left:4px solid var(--g);padding-left:8px}
.md table{border-collapse:collapse;width:100%;font-size:12.5px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--bd);padding:5px 6px;text-align:left;vertical-align:top;min-width:96px}
.md td:first-child,.md th:first-child{min-width:70px}
.md th{background:var(--gl)}
.md blockquote{margin:8px 0;padding:8px 10px;background:#fff9db;border-radius:10px;font-size:13px}
.md li{margin:3px 0;line-height:1.55}
.md p{line-height:1.6}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.switch{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.more{display:block;width:100%;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>DSE JUPAS 選科助手</h1>
  <div class="sub">輸入預計成績，睇下 JUPAS 邊啲學士課程啱你 · 資料只供參考</div>
</header>
<main>
<section class="page on" id="p-home">
  <div class="card">
    <div class="seg" id="modeSeg">
      <button data-m="grades" class="on">逐科輸入成績</button>
      <button data-m="total">只輸入總分</button>
    </div>
    <div id="gradesBox">
      <div class="grid">
        <label class="f">中文<select id="g-CHI"></select></label>
        <label class="f">英文<select id="g-ENG"></select></label>
        <label class="f">數學（必修部分）<select id="g-MATH"></select></label>
        <label class="f">公民與社會發展<select id="g-CSD"><option value="A">達標</option><option value="N">未達標</option></select></label>
        <label class="f">數學延伸部分<select id="g-M12t"><option value="">沒有修讀</option><option value="M1">M1</option><option value="M2">M2</option></select></label>
        <label class="f">延伸部分等級<select id="g-M12"></select></label>
      </div>
      <div style="margin-top:12px;font-size:13px;font-weight:600">選修科</div>
      <div id="electives"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost sm" id="addElec">＋ 新增選修科</button>
        <span class="muted">示例：</span>
        <button class="btn ghost sm" data-preset="a">5*5*5**5*55</button>
        <button class="btn ghost sm" data-preset="b">333322</button>
      </div>
    </div>
    <div id="totalBox" style="display:none">
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <label class="f">最佳五科總分<input type="number" id="t-score" min="0" max="45" step="0.5" placeholder="例如 25"></label>
        <label class="f">計分尺度<select id="t-scale"><option value="7">7 分制（5**=7、5*=6、5=5）</option><option value="8.5">8.5 分制（5**=8.5、5*=7、5=5.5）</option></select></label>
      </div>
      <p class="muted" style="margin:8px 0 0">總分模式只用嚟粗略比較：<b>唔會檢查</b>一般入學要求、指定科目要求同科目比重，所以結果只係參考。有加權嘅課程會假設你各科表現平均，按課程滿分比例粗略換算；理大（幾百分制）同大幅加權嘅課程會顯示「未能比較」。跨 7 分制／8.5 分制會用較保守嘅換算。</p>
    </div>
  </div>

  <div class="card" style="padding:12px">
    <input type="search" id="q" placeholder="搜尋課程名稱、院校、編號（例如 醫、JS6456、Computer）">
    <div class="chips" id="instChips" style="margin-top:8px"></div>
    <div class="toolbar">
      <select id="discSel"></select>
      <select id="sortSel">
        <option value="match">排序：配對程度</option>
        <option value="margin">排序：高出中位數比例</option>
        <option value="inst">排序：院校</option>
        <option value="code">排序：課程編號</option>
      </select>
    </div>
    <div class="row" style="margin-top:8px;justify-content:space-between">
      <label class="switch"><input type="checkbox" id="onlyElig"> 只顯示符合入學要求</label>
      <span class="muted" id="countTxt"></span>
    </div>
    <div class="sum" id="sumBox"></div>
  </div>
  <div id="list"></div>
  <button class="btn ghost more" id="moreBtn" style="display:none">顯示更多</button>
  <div class="disc" style="margin-top:12px" id="discl1"></div>
</section>

<section class="page" id="p-fav">
  <div class="card"><b>我的最愛</b> <span class="muted">（儲存喺呢部裝置嘅瀏覽器）</span></div>
  <div id="favList"></div>
</section>

<section class="page" id="p-method">
  <div class="card md" id="mdBox"></div>
</section>

<section class="page" id="p-about">
  <div class="card md" id="aboutBox"></div>
</section>
</main>

<nav class="tabs" id="tabs">
  <button data-p="home" class="on"><span class="i">🎓</span>課程</button>
  <button data-p="fav"><span class="i">♥</span>最愛</button>
  <button data-p="method"><span class="i">🧮</span>計分方法</button>
  <button data-p="about"><span class="i">ℹ︎</span>說明</button>
</nav>

## 香港大學（HKU）

- **等級換算（甲類）**：5**=8.5、5*=7、5=5.5、4=4、3=3、2=2、1=1、其他=0。
- **丙類（其他語言）**：港大有獨立換算表（例如日文 N1=8.5、N2=7、N3=4）。
- **公式**：每個課程有自己嘅公式，例如：
  - Best 5 Subjects（可包括 M1/M2 或丙類科目，取較高者），例如建築、心理學、社會科學。
  - Best 6 Subjects，例如內外全科醫學士（JS6456）、藥劑學（JS6494）。
  - 1.5 x Eng + 1.5 x Math + Best 3 Subjects + 0.2 x 6th Best Subject，例如工商管理學學士（JS6755）。
  - 2 x Eng + Best 4 Subjects（Weighting 1：中文 x1.5），例如文學士（JS6054）。
- **科目比重（2025 年版本，Weighting 1–9）**：例如 JS6298：2 x Eng + 1.5 x Math + Best 2 Subjects with Weighting 2 + Best Subject；JS6602：2 x Eng + 2 x Math + Best 4 Subjects with Weighting 9（理科／科技科 x2，其他科 x1.5）。各 Weighting 嘅科目清單見港大 PDF。
- **第 6、7 科**：只會喺適用時計算；只有 5 科可計分科目嘅考生仍然會獲考慮。
- **HKU 彈性收生安排**：中文、英文或兩科選修其中一科考唔到 3 級但有 2 級嘅考生，總分會扣減 10%（必須將課程放喺 Band A 並通過面試）。
- **未有資料**：本 App 搵唔到港大 2026 年收生分數嘅官方來源，所以用 2025 年數字。

## 本 App 點樣簡化

1. **M1/M2** 當作一科計（只可揀 M1 或 M2 其中一科）；冇模擬丙類語言科同乙類應用學習科。
2. 有「最多 X 科計比重」或「以下其中最好一科」嘅課程，App 會用最有利嘅組合計，但未必同院校計算機完全一樣。
3. 浸大、嶺大嘅課程比重未能取得，所以用不加權分數，並標示「比重未計」。
4. 總分模式只係粗略參考：唔同院校嘅尺度（7 分制、8.5 分制、理大幾百分制）唔可以直接比較；有加權嘅課程會按課程滿分比例粗略換算，比例超過 1.6 就顯示「未能比較」，跨尺度會用較保守嘅換算。
5. 都大及大部分 SSSDP 院校只公布平均分（或上／下四分位），App 會清楚標示「以平均分比較」／「以上／下四分位比較」：≥ 平均分當「穩陣」，低過就當「進取」。
</script>
<script>
'use strict';
/* ===== 資料 ===== */
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const META = DATA.meta, PROGS = DATA.programmes, INST = META.institutions;
const MD = document.getElementById('MD').textContent;

const SUBJ = {CHI:'中國語文',ENG:'英國語文',MATH:'數學',CSD:'公民與社會發展',M12:'數學延伸部分 (M1/M2)',
 BIO:'生物',CHEM:'化學',PHY:'物理',CSCI:'綜合科學',ICT:'資訊及通訊科技',ECON:'經濟',BAFS_ACC:'企會財（會計）',BAFS_BM:'企會財（商業管理）',
 GEOG:'地理',CHIST:'中國歷史',HIST:'歷史',CLIT:'中國文學',ELIT:'英語文學',DAT:'設計與應用科技',TL_FST:'科技與生活（食品科學與科技）',
 TL_FCT:'科技與生活（服裝、成衣與紡織）',THS:'旅遊與款待',VA:'視覺藝術',MUS:'音樂',PE:'體育',HMSC:'健康管理與社會關懷',ERS:'倫理與宗教',HCP:'醫護實務'};
const ELECTIVES = ['BIO','CHEM','PHY','ICT','ECON','BAFS_ACC','BAFS_BM','GEOG','CHIST','HIST','CLIT','ELIT','DAT','TL_FST','TL_FCT','THS','VA','MUS','PE','HMSC','ERS','HCP','CSCI'];
const GRADES = ['5**','5*','5','4','3','2','1','U'];
const RANK = {'5**':7,'5*':6,'5':5,'4':4,'3':3,'2':2,'1':1,'U':0};
const PTS = {'8.5':{7:8.5,6:7,5:5.5,4:4,3:3,2:2,1:1,0:0}, '7':{7:7,6:6,5:5,4:4,3:3,2:2,1:1,0:0}};
const LV = r => r==7?'5**':r==6?'5*':String(r);

const LABEL = {safe:['穩陣','b1'],ok:['有機會','b2'],reach:['進取','b3'],na:['未有資料','b4'],nc:['未能比較','b4'],no:['不符合','b5']};
const ORDER = {safe:0,ok:1,reach:2,nc:3,na:3,no:4};

/* ===== 入學要求檢查 ===== */
// student: {ranks:{CHI,ENG,MATH,M12?,BIO...}, csd:'A'|'N'}
function electivePool(st, m12el){
  const pool=[];
  for(const s in st.ranks){ if(s==='CHI'||s==='ENG'||s==='MATH') continue; pool.push(s); }
  return pool;
}
function optMatch(o, s, st, m12el){
  const r = st.ranks[s]; if(r==null) return false;
  if(o.cond){ for(const c in o.cond){ if((st.ranks[c]||0) < o.cond[c]) return false; } }
  const need = o.lv==='A' ? 1 : o.lv;   // 「達標」類要求：有修讀並取得成績即當符合
  if(o.s==='ANY'){ if(s==='M12' && !m12el) return false; return r>=need; }
  return o.s.includes(s) && r>=need;
}
function altOK(alt, st, m12el){
  const units=[]; alt.forEach(it=>{ for(let i=0;i<it.n;i++) units.push(it); });
  // 指定科目先配對，「任何科目」最後
  units.sort((a,b)=>spec(a)-spec(b));
  const pool=electivePool(st,m12el), used=new Set();
  const dfs=i=>{ if(i===units.length) return true;
    for(const s of pool){ if(used.has(s)) continue;
      if(units[i].opts.some(o=>optMatch(o,s,st,m12el))){ used.add(s); if(dfs(i+1)) return true; used.delete(s); } }
    return false; };
  return dfs(0);
}
function spec(it){ return it.opts.some(o=>o.s==='ANY')?1000:it.opts.reduce((a,o)=>a+o.s.length,0); }
function descItem(it){
  const parts=it.opts.map(o=>{
    const lv=o.lv==='A'?'達標':'第'+LV(o.lv)+'級';
    if(o.s==='ANY') return '任何選修科'+(o.cond?'（數學達第'+o.cond.MATH+'級）':'')+' '+lv;
    return o.s.map(x=>SUBJ[x]||x).join('／')+' '+lv; });
  return it.n+' 科：'+parts.join(' 或 ');
}
function checkReq(req, st, m12el, label){
  const out=[]; if(!req) return out;
  const c=req.core||{};
  for(const s of ['CHI','ENG','MATH']){ if(c[s]!=null && (st.ranks[s]||0)<c[s]) out.push(label+'：'+SUBJ[s]+'需達第 '+LV(c[s])+' 級'); }
  if(c.CSD==='A' && st.csd!=='A') out.push(label+'：公民與社會發展需「達標」');
  if(req.alts && req.alts.length && !req.alts.some(a=>altOK(a,st,m12el))){
    out.push(label+'：選修科未達要求（需符合以下其中一組）\n'+req.alts.map((a,i)=>'　'+(i+1)+'. '+a.map(descItem).join('＋')).join('\n'));
  }
  return out;
}

/* ===== 計分 ===== */
function subjPts(st, scale){ const p={}; for(const s in st.ranks){ p[s]=PTS[scale][st.ranks[s]]; } return p; }
function slotVal(slot,s,pts){
  if(slot.f && !slot.f.includes(s)) return -1;
  const w = slot.w && slot.w[s]!=null ? slot.w[s] : (slot.d!=null?slot.d:1);
  return pts[s]*w;
}
function calcFormula(f, st){
  const scale=f.scale||'8.5', pts=subjPts(st,scale);
  // 部分院校（東華、樹仁、THEi）將公社科「達標」當第 2 級計分
  if(f.csd && st.csd==='A') pts.CSD=f.csd;
  const subs=Object.keys(pts).filter(s=>s!=='CSD'||f.csd);
  const excl=f.excl||[];
  const slots=f.slots, n=slots.length;
  const same=slots.map((s,i)=>i>0 && JSON.stringify(s)===JSON.stringify(slots[i-1]));
  let best=-1, bestUse=null; const use=new Array(n).fill(null), used=new Set();
  // 上限估算：剩餘 slot 最高可得分（剪枝）
  const slotMax=slots.map(sl=>Math.max(0,...subs.map(s=>slotVal(sl,s,pts))));
  const suf=new Array(n+1).fill(0); for(let i=n-1;i>=0;i--) suf[i]=suf[i+1]+slotMax[i];
  const conflict=s=>excl.some(p=>p.includes(s)&&p.some(o=>o!==s&&used.has(o)));
  const dfs=(i,sum,minIdx)=>{
    if(sum+suf[i]<=best) return;
    if(i===n){ best=sum; bestUse=use.slice(); return; }
    const start = same[i]? minIdx : 0;
    for(let k=start;k<subs.length;k++){ const s=subs[k]; if(used.has(s)||conflict(s)) continue;
      const v=slotVal(slots[i],s,pts); if(v<0) continue;
      used.add(s); use[i]=s; dfs(i+1,sum+v,k+1); used.delete(s); use[i]=null; }
    // 呢個 slot 留空（考生科目不足）
    use[i]=null; dfs(i+1,sum,same[i]?subs.length:0);
  };
  dfs(0,0,0);
  if(best<0){ best=0; bestUse=new Array(n).fill(null); }
  const usedSet=new Set(bestUse.filter(Boolean));
  const rest=subs.filter(s=>!usedSet.has(s) && !excl.some(p=>p.includes(s)&&p.some(o=>o!==s&&usedSet.has(o))));
  let bonus=0, bonusTxt='';
  if(f.bonus){
    const b=f.bonus;
    if(b.t==='nth' && rest.length){ const s=rest.sort((a,c)=>pts[c]-pts[a])[0]; bonus=b.k*pts[s]; bonusTxt=b.k+' × '+(SUBJ[s]||s); }
    if(b.t==='hkust' && rest.length){ const s=rest.sort((a,c)=>pts[c]-pts[a])[0];
      if(pts[s]>=3){ bonus=b.max*0.05*pts[s]/8.5; bonusTxt='第 6 科 '+(SUBJ[s]||s)+' 加分'; } }
    if(b.t==='polyu'){ const w=slots[0].w||{}; let bv=0,bs=null;
      rest.forEach(s=>{ if(st.ranks[s]>=3){ const v=pts[s]*(w[s]!=null?w[s]:1); if(v>bv){bv=v;bs=s;} } });
      if(bs){ bonus=bv*0.1; bonusTxt='第 6 科 '+(SUBJ[bs]||bs)+' × 10%（估算）'; } }
  }
  const detail=bestUse.map((s,i)=>s?{s,pts:pts[s],w:slotVal(slots[i],s,pts)/(pts[s]||1)}:null).filter(Boolean);
  return {total:round2(best+bonus), base:round2(best), bonus:round2(bonus), bonusTxt, detail, scale};
}
const GENERIC = {slots:[{},{},{},{},{}]};
function round2(x){ return Math.round(x*100)/100; }
const MAXST = (()=>{ const r={CHI:7,ENG:7,MATH:7,M12:7}; ELECTIVES.forEach(e=>r[e]=7); return {ranks:r,csd:'A'}; })();
const maxCache=new Map();
function formulaMax(p){ if(!maxCache.has(p.code)){ const f=p.formula; maxCache.set(p.code, calcFormula(f,MAXST).total); } return maxCache.get(p.code); }
function isPlainBest5(f){ return f.slots.length===5 && !f.bonus && !f.csd && f.slots.every(s=>!s.w && s.d==null && !s.f); }

/* ===== 比較 ===== */
function refOf(p){ const s=p.score; if(!s) return null;
  if(s.median!=null) return {m:s.median, lq:s.lq, uq:s.uq, year:s.year, kind:'median'};
  if(s.mean!=null) return {m:s.mean, lq:null, year:s.year, kind:'mean'};
  if(s.lq!=null) return {m:null, lq:s.lq, uq:s.uq, year:s.year, kind:'uqlq'};
  return null; }
const base = ref => ref.m!=null ? ref.m : ref.lq;
function labelFor(score, ref){
  if(ref.kind==='uqlq'){ if(ref.uq!=null && score>=ref.uq) return 'safe'; return score>=ref.lq?'ok':'reach'; }
  if(score>=ref.m) return 'safe';
  if(ref.lq!=null) return score>=ref.lq?'ok':'reach';
  return 'reach';
}
function evalGrades(p, st){
  const r={p, fails:[], tags:[]};
  r.fails = checkReq(p.gen, st, p.m12el, '一般入學要求').concat(checkReq(p.req, st, p.m12el, '課程要求'));
  const scale = (p.formula&&p.formula.scale) || INST[p.inst].scale;
  if(p.formula){ r.calc=calcFormula(p.formula, st); if(p.formula.partial) r.tags.push(p.formula.partialTag||'科目比重未計'); }
  else { r.calc=calcFormula(Object.assign({scale},GENERIC), st); r.tags.push('通用最佳五科（課程公式未有資料）'); }
  r.score=r.calc.total; r.scale=scale;
  const ref=refOf(p); r.ref=ref;
  if(r.fails.length){ r.label='no'; }
  else if(!ref){ r.label='na'; }
  else if(!p.formula && base(ref) > 5*PTS[scale][7]){ r.label='nc'; }
  else { r.label=labelFor(r.score, ref); }
  if(ref && ref.kind==='mean') r.tags.push('以平均分比較');
  if(ref && ref.kind==='uqlq') r.tags.push('以上／下四分位比較');
  r.margin = ref&&base(ref)? (r.score-base(ref))/base(ref) : -999;
  return r;
}
function evalTotal(p, T, uScale){
  const r={p, fails:[], tags:[]}; const ref=refOf(p); r.ref=ref;
  const pScale=(p.formula&&p.formula.scale)||INST[p.inst].scale;
  r.scale=pScale;
  let t=T; if(uScale!==pScale){ t = uScale==='8.5' ? T*7/8.5 : T; r.tags.push(uScale==='8.5'?'8.5→7 分制保守換算':'7→8.5 分制保守換算'); }
  let ratio=1;
  if(p.formula){
    if(isPlainBest5(p.formula)) r.tags.push('同為最佳五科');
    else { ratio = formulaMax(p)/(5*PTS[pScale][7]);
      if(ratio>1.6 || ratio<0.75){ r.label='nc'; r.tags.push('計分尺度不同（課程滿分 '+round2(formulaMax(p))+'）'); }
      else if(Math.abs(ratio-1)>0.001){ r.tags.push('按課程滿分比例粗略換算 ×'+round2(ratio)+(ratio>1.25?'（加權較重，誤差較大）':'')); }
      else r.tags.push('粗略比較（課程有指定科目）'); }
    if(p.formula.partial) r.tags.push(p.formula.partialTag||'科目比重未計');
  } else r.tags.push('課程公式未有資料，假設最佳五科');
  r.score=round2(t*ratio);
  if(!r.label){
    if(!ref) r.label='na';
    else if(base(ref) > 5*PTS[pScale][7]*1.25) { r.label='nc'; }
    else r.label=labelFor(r.score, ref);
  }
  if(ref && ref.kind==='mean') r.tags.push('以平均分比較');
  if(ref && ref.kind==='uqlq') r.tags.push('以上／下四分位比較');
  r.margin = ref&&base(ref)? (r.score-base(ref))/base(ref) : -999;
  return r;
}

/* ===== 狀態 ===== */
const LS_IN='dsejupas_inputs_v1', LS_FAV='dsejupas_favs';
let favs = new Set(JSON.parse(localStorage.getItem(LS_FAV)||'[]'));
let state = Object.assign({mode:'grades', CHI:'4', ENG:'4', MATH:'4', CSD:'A', M12t:'', M12:'4', elec:[['BIO','4'],['CHEM','4']], total:'', tscale:'7',
  q:'', inst:'all', disc:'all', sort:'match', only:false, label:'all'}, JSON.parse(localStorage.getItem(LS_IN)||'{}'));
let shown=60;
function save(){ localStorage.setItem(LS_IN, JSON.stringify(state)); }
function saveFav(){ localStorage.setItem(LS_FAV, JSON.stringify([...favs])); }

function studentFromState(){
  const ranks={CHI:RANK[state.CHI], ENG:RANK[state.ENG], MATH:RANK[state.MATH]};
  if(state.M12t) ranks.M12=RANK[state.M12];
  state.elec.forEach(([s,g])=>{ if(s && g!=null) ranks[s]=Math.max(ranks[s]||0, RANK[g]); });
  return {ranks, csd:state.CSD};
}

/* ===== UI ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gradeOpts(sel){ return GRADES.map(g=>`<option value="${g}"${g===sel?' selected':''}>${g}</option>`).join(''); }
function initInputs(){
  ['CHI','ENG','MATH','M12'].forEach(k=>{ $('g-'+k).innerHTML=gradeOpts(state[k]); });
  $('g-CSD').value=state.CSD; $('g-M12t').value=state.M12t;
  $('t-score').value=state.total; $('t-scale').value=state.tscale;
  ['CHI','ENG','MATH','M12','CSD','M12t'].forEach(k=>$('g-'+k).onchange=e=>{state[k]=e.target.value; update();});
  $('t-score').oninput=e=>{state.total=e.target.value; update();};
  $('t-scale').onchange=e=>{state.tscale=e.target.value; update();};
  $('addElec').onclick=()=>{ const usedS=new Set(state.elec.map(e=>e[0])); state.elec.push([ELECTIVES.find(e=>!usedS.has(e)),'4']); renderElec(); update(); };
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
    if(b.dataset.preset==='a') Object.assign(state,{CHI:'5*',ENG:'5*',MATH:'5**',CSD:'A',M12t:'',elec:[['BIO','5*'],['CHEM','5'],['PHY','5']]});
    else Object.assign(state,{CHI:'3',ENG:'3',MATH:'3',CSD:'A',M12t:'',elec:[['ECON','3'],['GEOG','2'],['HIST','2']]});
    initInputs(); renderElec(); update(); });
  document.querySelectorAll('#modeSeg button').forEach(b=>{ b.classList.toggle('on',b.dataset.m===state.mode);
    b.onclick=()=>{ state.mode=b.dataset.m; document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b)); update(); }; });
}
function renderElec(){
  $('electives').innerHTML = state.elec.map(([s,g],i)=>`<div class="erow">
    <select data-i="${i}" class="es">${ELECTIVES.map(e=>`<option value="${e}"${e===s?' selected':''}>${SUBJ[e]}</option>`).join('')}</select>
    <select data-i="${i}" class="eg">${gradeOpts(g)}</select>
    <button class="x" data-i="${i}" aria-label="刪除">×</button></div>`).join('');
  document.querySelectorAll('.es').forEach(el=>el.onchange=e=>{state.elec[+el.dataset.i][0]=e.target.value; update();});
  document.querySelectorAll('.eg').forEach(el=>el.onchange=e=>{state.elec[+el.dataset.i][1]=e.target.value; update();});
  document.querySelectorAll('#electives .x').forEach(el=>el.onclick=()=>{state.elec.splice(+el.dataset.i,1); renderElec(); update();});
}
function initFilters(){
  const ic=[['all','全部'],['g:ugc','八大'],['g:other','都大及SSSDP']].concat(Object.keys(INST).map(k=>[k,INST[k].short]));
  $('instChips').innerHTML=ic.map(([k,n])=>`<button class="chip${state.inst===k?' on':''}" data-k="${k}">${n}</button>`).join('');
  $('instChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{state.inst=c.dataset.k; $('instChips').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); update();});
  const ds=[...new Set(PROGS.map(p=>p.disc))].sort();
  $('discSel').innerHTML='<option value="all">學科範疇：全部</option>'+ds.map(d=>`<option${d===state.disc?' selected':''}>${d}</option>`).join('');
  $('discSel').onchange=e=>{state.disc=e.target.value; update();};
  $('sortSel').value=state.sort; $('sortSel').onchange=e=>{state.sort=e.target.value; update();};
  $('q').value=state.q; $('q').oninput=e=>{state.q=e.target.value; update();};
  $('onlyElig').checked=state.only; $('onlyElig').onchange=e=>{state.only=e.target.checked; update();};
}

function computeAll(){
  if(state.mode==='grades'){ const st=studentFromState(); return PROGS.map(p=>evalGrades(p,st)); }
  const T=parseFloat(state.total);
  if(!(T>0)) return PROGS.map(p=>({p,label:'na',fails:[],tags:['請先輸入總分'],ref:refOf(p),score:null,margin:-999,empty:true}));
  return PROGS.map(p=>evalTotal(p,T,state.tscale));
}
function matchesFilter(r){
  const p=r.p;
  if(state.inst.startsWith('g:')){ if((INST[p.inst].group||'ugc')!==state.inst.slice(2)) return false; }
  else if(state.inst!=='all' && p.inst!==state.inst) return false;
  if(state.disc!=='all' && p.disc!==state.disc) return false;
  if(state.only && r.label==='no') return false;
  if(state.q){ const q=state.q.trim().toLowerCase(); const I=INST[p.inst];
    const hay=(p.code+' '+p.nameZh+' '+p.nameEn+' '+p.short+' '+p.disc+' '+I.zh+' '+I.short+' '+I.en).toLowerCase();
    if(!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
  return true;
}
function sorter(a,b){
  if(state.sort==='code') return a.p.code.localeCompare(b.p.code);
  if(state.sort==='inst') return Object.keys(INST).indexOf(a.p.inst)-Object.keys(INST).indexOf(b.p.inst) || a.p.code.localeCompare(b.p.code);
  if(state.sort==='margin') return b.margin-a.margin;
  return ORDER[a.label]-ORDER[b.label] || (a.label==='safe'? a.margin-b.margin : b.margin-a.margin) || a.p.code.localeCompare(b.p.code);
}
function fmt(x){ return x==null?'未有資料':(Math.round(x*100)/100); }
function card(r){
  const p=r.p, I=INST[p.inst], L=LABEL[r.label]; const ref=r.ref; const f=p.formula;
  const scoreName = state.mode==='grades' ? '你的分數' : '你的分數（換算）';
  const refTxt = ref ? (ref.kind==='mean'
      ? `<div class="kv">平均分<b>${fmt(ref.m)}</b></div>`
      : ref.kind==='uqlq' ? `<div class="kv">上四分位<b>${fmt(ref.uq)}</b></div><div class="kv">下四分位<b>${fmt(ref.lq)}</b></div>`
      : `<div class="kv">中位數<b>${fmt(ref.m)}</b></div><div class="kv">下四分位<b>${fmt(ref.lq)}</b></div>`)+`<div class="kv">${ref.year} 年</div>`
    : `<div class="kv">收生分數<b style="font-size:12px">未有資料</b></div>`;
  const tags=(r.tags||[]).map(t=>`<span class="tag${/保守|同為|粗略比較/.test(t)?' gr':''}">${esc(t)}</span>`).join('');
  const reqTxt = p.same ? '與院校一般入學要求相同' : '';
  const det=[];
  if(r.fails && r.fails.length) det.push(`<h4>未符合</h4><pre>${esc(r.fails.join('\n'))}</pre>`);
  if(state.mode==='grades' && r.calc){

  det.push(`<h4>入學要求（JUPAS 2027 目錄）</h4><div style="white-space:pre-line">${reqTxt?esc(reqTxt)+'<br>':''}${p.req?esc(reqSummary(p.req)):''}${!p.same&&!p.req?'未有資料':''}</div>`);
  if(p.remarks) det.push(`<h4>備註（原文）</h4><pre>${esc(p.remarks)}</pre>`);
  det.push(`<div style="margin-top:8px"><a href="${esc(p.jupasUrl)}" target="_blank" rel="noopener">JUPAS 課程頁</a>${p.website?` · <a href="${esc(p.website)}" target="_blank" rel="noopener">課程網站</a>`:''} · 學費：${esc(p.fee||'未有資料')} · 範疇（自動分類）：${esc(p.disc)}</div>`);
  return `<div class="card prog" data-code="${p.code}">
   <div class="top"><span class="badge ${L[1]}">${r.label==='na'&&r.empty?'—':L[0]}</span><span class="inst">${I.short}</span>${p.funding&&p.funding!=='UGC-funded'?`<span class="inst fund">${p.funding==='SSSDP'?'SSSDP 資助':'自資'}</span>`:''}<span class="code">${p.code}</span>
   <button class="fav${favs.has(p.code)?' on':''}" data-code="${p.code}" aria-label="加入最愛">♥</button></div>
   <div class="pname">${esc(p.nameZh)}</div><div class="pen">${esc(p.nameEn)}</div>
   <div class="scorebar">${r.score!=null?`<div class="kv">${scoreName}<b>${fmt(r.score)}</b></div>`:''}${refTxt}</div>
   ${tags?`<div style="margin-top:6px">${tags}</div>`:''}
   ${r.fails&&r.fails.length?`<div class="fail">✕ ${esc(r.fails[0].split('\n')[0])}${r.fails.length>1?'（另 '+(r.fails.length-1)+' 項）':''}</div>`:''}
   <details><summary>詳情 ▾</summary><div class="det">${det.join('')}</div></details></div>`;
}
function reqSummary(req){
  const c=req.core||{}; const a=['CHI','ENG','MATH'].filter(s=>c[s]!=null).map(s=>SUBJ[s]+' '+LV(c[s]));

  return t;
}

/* ===== 迷你 Markdown ===== */
function mdInline(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/&lt;(https?:\/\/[^\s&]+(?:&amp;[^\s&]+)*)&gt;/g,(m,u)=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'').slice(0,60)}${u.length>68?'…':''}</a>`)
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const L=src.split('\n'); let h='', i=0;
  while(i<L.length){ let l=L[i];
    if(/^#{1,4} /.test(l)){ const n=l.match(/^#+/)[0].length; h+=`<h${n}>${mdInline(l.slice(n+1))}</h${n}>`; i++; continue; }
    if(/^---\s*$/.test(l)){ h+='<hr>'; i++; continue; }
    if(/^\|/.test(l)){ const rows=[]; while(i<L.length && /^\|/.test(L[i])){ rows.push(L[i]); i++; }
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      h+='<table><thead><tr>'+cells(rows[0]).map(c=>`<th>${mdInline(c)}</th>`).join('')+'</tr></thead><tbody>'+
        rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${mdInline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>'; continue; }
    if(/^> ?/.test(l)){ let b=[]; while(i<L.length && /^> ?/.test(L[i])){ b.push(L[i].replace(/^> ?/,'')); i++; } h+='<blockquote>'+b.map(mdInline).join('<br>')+'</blockquote>'; continue; }
    if(/^\s*([-*]|\d+\.) /.test(l)){ const ol=/^\s*\d+\./.test(l); let items=[];
      while(i<L.length && /^\s*([-*]|\d+\.) /.test(L[i])){ const ind=L[i].match(/^\s*/)[0].length; items.push([ind,L[i].replace(/^\s*([-*]|\d+\.) /,'')]); i++; }
      const tag=ol?'ol':'ul'; h+='<'+tag+'>'; let open=false;
      items.forEach(([ind,t])=>{ if(ind>0){ if(!open){h+='<ul>';open=true;} } else if(open){ h+='</ul>'; open=false; } h+='<li>'+mdInline(t)+'</li>'; });
      if(open) h+='</ul>'; h+='</'+tag+'>'; continue; }
    if(!l.trim()){ i++; continue; }
    let p=[]; while(i<L.length && L[i].trim() && !/^(#|\||>|\s*[-*] |\s*\d+\. |---)/.test(L[i])){ p.push(L[i]); i++; }
    h+='<p>'+p.map(mdInline).join('<br>')+'</p>';
  }
  return h;
}

/* ===== 說明頁 ===== */
function cov(){
  const n=PROGS.length, sc=PROGS.filter(p=>refOf(p)).length, fo=PROGS.filter(p=>p.formula).length;
  const ng=g=>PROGS.filter(p=>INST[p.inst].group===g).length;
  const byI=Object.keys(INST).map(k=>{ const ps=PROGS.filter(p=>p.inst===k); const yrs=[...new Set(ps.filter(p=>refOf(p)).map(p=>p.score.year))].join('/');
    const kinds=[...new Set(ps.filter(p=>refOf(p)).map(p=>refOf(p).kind))].map(x=>({median:'中位數',mean:'平均分',uqlq:'上下四分位'}[x])).join('、');
    return `| ${INST[k].zh} | ${ps.length} | ${ps.filter(p=>refOf(p)).length}（${yrs||'—'}${kinds?'；'+kinds:''}） | ${ps.filter(p=>p.formula).length}${['hkbu','lingnanu'].includes(k)?'（比重未計）':''} |`; }).join('\n');
  return {n,sc,fo,byI,nu:ng('ugc'),no:ng('other')};
}
function about(){
  const c=cov();
  return md(`# 關於本 App

> **免責聲明**：本 App 只係根據公開資料整理嘅參考工具，**唔代表**任何院校或 JUPAS 嘅官方立場，亦**唔保證**錄取。收生分數係過往年份嘅統計，每年都會變；院校仲會考慮面試、校內成績、其他經驗等因素。選科前請務必到 JUPAS 同各院校官網核實最新資料。

## 資料範圍

- JUPAS 目錄冇包括演藝學院（HKAPA）等其他自資院校，所以本 App 都冇。
- 入學要求：${META.catalogueYear}，即係而家申請緊嘅一屆（2026 年 10 月開始報名）。
- 收生分數：每間院校用搵到嘅最新官方數字（見下表）；有 **${c.sc}** 個課程有收生分數，**${c.fo}** 個有院校公布嘅計分公式。
- 資料整理日期：${META.generated}（香港時間）。

| 院校 | 課程數 | 有收生分數（年份） | 有計分公式 |
|---|---|---|---|
${c.byI}

## 配對標籤點樣定
- **穩陣**：你嘅分數 ≥ 中位數（只公布平均分嘅院校用 ≥ 平均分；珠海只公布上／下四分位，用 ≥ 上四分位）。
- **有機會**：≥ 下四分位數（LQ），但低過中位數。
- **進取**：符合最低入學要求，但低過 LQ（或者低過平均分）。
- **不符合**：未達一般入學要求或課程指定科目要求。
- **未有資料／未能比較**：冇收生分數，或者計分尺度唔同，冇得比較（頂部統計合併顯示為「未能比較」）。

## 計分點樣計
- **逐科模式**：每個課程盡量用院校公布嘅公式（換算尺度、比重、最佳 N 科、第 6 科加分）。冇公式嘅課程會用通用最佳五科估算，並清楚標示。浸大、嶺大嘅課程比重未取得，所以用不加權最佳五科計，分數可能會偏低。
- **總分模式**：輸入最佳五科總分（7 分制：5**=7、5*=6、5=5；或 8.5 分制：5**=8.5、5*=7、5=5.5）。這個模式唔會檢查入學要求同科目比重：如果課程有加權，就假設你各科表現平均，按「課程公式滿分 ÷ 最佳五科滿分」比例粗略換算（比例超過 1.25 會標示「誤差較大」）；比例超過 1.6（例如理大幾百分制、部分大幅加權課程）就顯示「未能比較」。

## 簡化同限制
- 冇模擬應用學習（ApL）科目、其他語言（丙類）科目同乙類成績。
- 備註入面嘅額外要求（例如面試、作品集、體格要求、特定組合）只會顯示原文，唔會自動檢查。
- 港大彈性收生（扣 10% 分）、浸大差一級特別考慮、都大彈性收生、重考生安排等都冇計入。
- 都大、SSSDP 院校大多只公布平均分（唔係中位數），比較結果只可以當粗略參考。
- 中大「最多 3 科計比重」等規則用最有利組合近似。
- 理大第 6 科加分嘅計法，院校例子同 FAQ 寫法有出入，本 App 用例子估算。
- 學科範疇係按英文課程名稱自動分類，只供篩選用。
- 最愛同輸入只會儲存喺你部裝置嘅瀏覽器（localStorage），唔會上傳。
`);
}
